on:
  push:
    paths:
      - config/adv360.keymap
      - keymap_drawer.config.yaml
      - Makefile
  workflow_dispatch:

name: Draw keymap

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Draw
        run: make draw
      - name: Commit drawing
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Draw keymap
          file_pattern: keymap-drawer/*
